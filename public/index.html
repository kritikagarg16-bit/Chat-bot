<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Chatbot ✨</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="bot-avatar">
          <span>✨</span>
        </div>
        <h1>My AI Chat</h1>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
      <div class="sidebar-footer">
        <p>Powered by Groq ⚡</p>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-container">
      <div class="chat-header">
        <div class="header-info">
          <div class="status-dot"></div>
          <span>AI Assistant</span>
        </div>
        <button class="clear-btn" id="clearBtn" title="Clear chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Clear
        </button>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages">
        <div class="welcome-screen">
          <div class="welcome-icon">🤖</div>
          <h2>Hello! I'm your AI Assistant</h2>
          <p>Ask me anything — I'm here to help!</p>
          <div class="suggestion-chips">
            <button class="chip" onclick="sendSuggestion('What can you help me with?')">What can you help me with?</button>
            <button class="chip" onclick="sendSuggestion('Write me a poem about the stars')">Write a poem ✨</button>
            <button class="chip" onclick="sendSuggestion('Explain quantum computing simply')">Explain quantum computing</button>
            <button class="chip" onclick="sendSuggestion('Give me a fun fact!')">Fun fact 🎯</button>
          </div>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            placeholder="Type a message... (Enter to send, Shift+Enter for newline)"
            rows="1"
            autofocus
          ></textarea>
          <button class="send-btn" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <p class="disclaimer">AI can make mistakes. Verify important info.</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
